name: Build & Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install
      - name: Build installers
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.exe
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AG Holding Staff ${{ github.ref_name }}
          body: |
            macOS (universal), Windows and Linux builds of the AG Holding Staff app.

            The app is **ad-hoc signed but not Apple-notarized** (no paid certificate),
            so macOS / Windows will warn on first launch. To open it:

            **macOS** — if you see "damaged" or "cannot verify developer":
            1. Move the app to **Applications**.
            2. Open **Terminal** and run:
               ```
               xattr -cr "/Applications/AG Holding Staff.app"
               ```
            3. Open the app normally. (Or: right-click the app → **Open** → **Open**.)

            **Windows** — on the SmartScreen prompt: **More info** → **Run anyway**.

            **Linux** — `chmod +x` the AppImage, or install the `.deb`.
          files: artifacts/**/*
          fail_on_unmatched_files: false
